<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quadratic Equation Solver</title>
  <style>
    /* ── Base Reset & Font ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
      padding: 2rem;
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }

    /* ── Header ── */
    .badge {
      display: inline-block;
      background: rgba(139,92,246,0.25);
      color: #c4b5fd;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(139,92,246,0.4);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .equation-display {
      font-size: 1rem;
      color: #a78bfa;
      font-style: italic;
      margin-bottom: 2rem;
      letter-spacing: 0.03em;
    }

    /* ── Form ── */
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .field input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 0.75rem 0.6rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139,92,246,0.25);
    }

    .field input::placeholder { color: #475569; }

    /* ── Button ── */
    button {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.03em;
    }

    button:hover  { opacity: 0.9; }
    button:active { transform: scale(0.98); }

    /* ── Result Box ── */
    .result {
      margin-top: 1.4rem;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 14px;
      padding: 1.2rem 1.4rem;
    }

    .result p { font-size: 0.95rem; color: #c4b5fd; margin-bottom: 0.5rem; }

    .roots {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    .root-chip {
      background: rgba(139,92,246,0.2);
      border: 1px solid rgba(139,92,246,0.45);
      border-radius: 10px;
      padding: 0.45rem 1rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ede9fe;
      letter-spacing: 0.02em;
    }

    /* ── Divider + Formula hint ── */
    .hint {
      margin-top: 1.6rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.78rem;
      color: #64748b;
      text-align: center;
    }

    .hint span { color: #7c3aed; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">IHS CHALLENGE</span>
    <h1>Quadratic<br>Equation Solver</h1>
    <div class="equation-display">ax² + bx + c = 0</div>

    <!-- The form sends data to Go using POST -->
    <form method="POST" action="/">
      <div class="fields">
        <div class="field">
          <label>a (x²)</label>
          <input type="number" name="a" step="any" placeholder="e.g. 1" required />
        </div>
        <div class="field">
          <label>b (x)</label>
          <input type="number" name="b" step="any" placeholder="e.g. -5" />
        </div>
        <div class="field">
          <label>c</label>
          <input type="number" name="c" step="any" placeholder="e.g. 6" />
        </div>
      </div>
      <button type="submit">Solve →</button>
    </form>

    <!-- This section only shows when Go sends back a result -->
    {{if .Message}}
    <div class="result">
      <p>{{.Message}}</p>
      {{if .HasResult}}
      <div class="roots">
        {{if .Root1}}<span class="root-chip">{{.Root1}}</span>{{end}}
        {{if .Root2}}<span class="root-chip">{{.Root2}}</span>{{end}}
      </div>
      {{end}}
    </div>
    {{end}}

    <div class="hint">
      Formula: <span>x = (−b ± √(b²−4ac)) / 2a</span>
    </div>
  </div>
</body>
</html>
